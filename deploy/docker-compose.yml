name: ridgeline

# Ridgeline production stack for the VM (lnuvm159). All public access arrives
# through the existing Cloudflare Tunnel, so services bind to localhost only and
# Cloudflare terminates TLS at the edge:
#   ridgeline.ve7kod.ca  -> tunnel -> localhost:8088 (caddy -> ridgelined)
#   mqtt-dev.ve7kod.ca   -> tunnel -> localhost:9001 (mosquitto websockets)
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ridgeline-mosquitto
    restart: unless-stopped
    ports:
      # Host 9101 (CoreScope's broker still holds 9001 during the parallel
      # transition) -> container 9001. Tunnel: mqtt-dev.ve7kod.ca -> localhost:9101.
      # Bind BOTH loopbacks: on this VM `localhost` resolves to ::1 (IPv6) only,
      # so cloudflared dialing localhost:9101 needs the IPv6 bind or it 502s.
      - "127.0.0.1:9101:9001" # observer websockets, reached via the tunnel
      - "[::1]:9101:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  # Authenticated observer broker, running BESIDE the anonymous one above so
  # observers can be migrated a node at a time with nothing losing its
  # connection. Observers here present an Ed25519 token signed by their own node
  # key; every decision is delegated to ridgelined (/api/mqtt-auth/*).
  #   mqtt2.ve7kod.ca -> tunnel -> localhost:9102
  # Retire this only once `get mqtt-auth` shows every observer migrated, at
  # which point nothing is publishing to the anonymous broker.
  mosquitto-jwt:
    build:
      context: ./mosquitto-jwt
    image: ridgeline-mosquitto-jwt:latest
    container_name: ridgeline-mosquitto-jwt
    restart: unless-stopped
    ports:
      # Same dual-loopback bind as the anonymous broker: on this VM `localhost`
      # resolves to ::1 only, so cloudflared needs the IPv6 bind or it 502s.
      - "127.0.0.1:9102:9001"
      - "[::1]:9102:9001"
    volumes:
      - ./mosquitto-jwt.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-jwt-data:/mosquitto/data

  ridgelined:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Stamp the running binary; set RIDGELINE_VERSION (e.g. a git tag) in
        # deploy/.env, else it logs version=dev.
        VERSION: ${RIDGELINE_VERSION:-dev}
    image: ridgeline:latest
    container_name: ridgeline-app
    restart: unless-stopped
    # Run as the host user that owns ./data so the bind-mounted DB dir + migrated
    # ridgeline.db are writable without a chown. Defaults to 1000 (jesse locally);
    # the VM user ve7kod is 1001, so create deploy/.env with the box's real ids:
    #   printf 'RIDGELINE_UID=%s\nRIDGELINE_GID=%s\n' "$(id -u)" "$(id -g)" > .env
    user: "${RIDGELINE_UID:-1000}:${RIDGELINE_GID:-1000}"
    depends_on:
      - mosquitto
      - mosquitto-jwt
    volumes:
      - ./config.json:/config/config.json:ro
      - ./data:/data # migrated ridgeline.db lives here (bind mount)
    # No host port: caddy reaches it over the compose network as ridgelined:8080.
    # Health surfaces in `docker ps` (the image self-probes /api/health).
    healthcheck:
      test: ["CMD", "/app/ridgelined", "-healthcheck", "-config", "/config/config.json"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: ridgeline-caddy
    restart: unless-stopped
    depends_on:
      - ridgelined
    ports:
      - "127.0.0.1:8088:80" # ingress, reached via the tunnel
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mosquitto-data:
  mosquitto-jwt-data:
  caddy-data:
  caddy-config:
