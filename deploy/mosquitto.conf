# Ridgeline's broker is open — no observer authentication (matches the
# ve7kod-dev observer config: websockets, TLS at the Cloudflare edge, no auth).

# Internal plain MQTT for the Ridgeline ingestor (compose network only —
# not published to the host, reached as mosquitto:1883 by ridgelined).
listener 1883 0.0.0.0

# External WebSocket for observer nodes via the Cloudflare Tunnel
# (mqtt-dev.ve7kod.ca -> localhost:9001).
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type information
