name: ridgeline

# Ridgeline production stack for the VM (lnuvm159). All public access arrives
# through the existing Cloudflare Tunnel, so services bind to localhost only and
# Cloudflare terminates TLS at the edge:
#   ridgeline.ve7kod.ca  -> tunnel -> localhost:8088 (caddy -> ridgelined)
#   mqtt2.ve7kod.ca      -> tunnel -> localhost:9102 (mosquitto-jwt websockets)
#
# The anonymous broker that used to sit on 9101 (mqtt1/mqtt-dev.ve7kod.ca) was
# removed on 2026-09-14: every observer now authenticates with a JWT, so there
# is no unauthenticated path into the mesh data any more.
services:
  # The observer broker. Observers present an Ed25519 token signed by their own
  # node key; every decision is delegated to ridgelined (/api/mqtt-auth/*).
  #   mqtt2.ve7kod.ca -> tunnel -> localhost:9102
  # This was the second of two brokers during the migration; the anonymous one
  # is gone, so this is now the only way in.
  mosquitto-jwt:
    build:
      context: ./mosquitto-jwt
    image: ridgeline-mosquitto-jwt:latest
    container_name: ridgeline-mosquitto-jwt
    restart: unless-stopped
    ports:
      # Bind BOTH loopbacks: on this VM `localhost` resolves to ::1 (IPv6) only,
      # so cloudflared dialing localhost:9102 needs the IPv6 bind or it 502s.
      - "127.0.0.1:9102:9001"
      - "[::1]:9102:9001"
    volumes:
      - ./mosquitto-jwt.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-jwt-data:/mosquitto/data

  ridgelined:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Stamp the running binary; set RIDGELINE_VERSION (e.g. a git tag) in
        # deploy/.env, else it logs version=dev.
        VERSION: ${RIDGELINE_VERSION:-dev}
    image: ridgeline:latest
    container_name: ridgeline-app
    restart: unless-stopped
    # Run as the host user that owns ./data so the bind-mounted DB dir + migrated
    # ridgeline.db are writable without a chown. Defaults to 1000 (jesse locally);
    # the VM user ve7kod is 1001, so create deploy/.env with the box's real ids:
    #   printf 'RIDGELINE_UID=%s\nRIDGELINE_GID=%s\n' "$(id -u)" "$(id -g)" > .env
    user: "${RIDGELINE_UID:-1000}:${RIDGELINE_GID:-1000}"
    depends_on:
      - mosquitto-jwt
    volumes:
      - ./config.json:/config/config.json:ro
      - ./data:/data # migrated ridgeline.db lives here (bind mount)
      # Finished firmware, written by the build agent and served from here.
      # READ-ONLY on purpose: ridgelined hands these out, it never produces them.
      - firmware-artifacts:/firmware:ro
      # A MeshCore checkout, read only to enumerate boards/environments for the
      # catalogue. Shared with the builder, which is what keeps it current.
      - meshcore-src:/meshcore-src:ro
    # No host port: caddy reaches it over the compose network as ridgelined:8080.
    # Health surfaces in `docker ps` (the image self-probes /api/health).
    healthcheck:
      test: ["CMD", "/app/ridgelined", "-healthcheck", "-config", "/config/config.json"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: ridgeline-caddy
    restart: unless-stopped
    depends_on:
      - ridgelined
    ports:
      - "127.0.0.1:8088:80" # ingress, reached via the tunnel
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # The firmware build agent. Profile-gated: `docker compose up -d` leaves it
  # alone, `--profile firmware` brings it in, so the build service is opt-in on
  # a box rather than something a routine deploy switches on.
  fwagent:
    build:
      context: ..
      dockerfile: deploy/fwagent.Dockerfile
    image: ridgeline-fwagent:latest
    container_name: ridgeline-fwagent
    restart: unless-stopped
    profiles: ["firmware"]
    depends_on:
      - ridgelined
    command:
      - "-api=http://ridgelined:8080"
      - "-image=meshcore-builder:latest"
      - "-pio-volume=meshcore-pio"
      - "-src-volume=meshcore-src"
      - "-out-volume=firmware-artifacts"
      - "-cpus=2"
    environment:
      # Must equal firmware.agentToken in config.json.
      FWAGENT_TOKEN: ${FWAGENT_TOKEN:?set FWAGENT_TOKEN in deploy/.env}
    volumes:
      # The socket is the whole reason this container exists separately. It is
      # root on the host: nothing else in this file gets it, and this service
      # publishes no ports.
      - /var/run/docker.sock:/var/run/docker.sock
    # Volume names are passed to the host daemon by NAME (see the command above),
    # so the agent does not mount them itself — but declaring them here makes
    # compose create them before the first build asks for them.

volumes:
  # Finished firmware. Written by builder containers the agent launches, read by
  # ridgelined to serve downloads.
  firmware-artifacts:
  # PlatformIO toolchains (~6 GB for nRF52 + ESP32) and the MeshCore checkout.
  # Volumes rather than image layers so they survive a builder image rebuild.
  meshcore-pio:
  meshcore-src:
  mosquitto-jwt-data:
  caddy-data:
  caddy-config:
