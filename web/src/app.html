<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#070a0e" />
		<!-- PWA / installable mobile app (scope /m) -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Ridgeline" />
		<meta
			name="description"
			content="Ridgeline — mesh network observability for MeshCore LoRa networks."
		/>
		<title>Ridgeline</title>
		<script>
			// Apply the saved theme before first paint to avoid a flash.
			try {
				if (localStorage.getItem('ridgeline-theme') === 'light')
					document.documentElement.classList.add('theme-light');
			} catch (e) {}
		</script>
		<!-- Umami analytics (self-hosted at umami.ve7kod.ca) -->
		<script
			defer
			src="https://umami.ve7kod.ca/script.js"
			data-website-id="4c10287b-81fe-4ae9-9197-e285b2fd4919"
		></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
