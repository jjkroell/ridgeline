name: ridgeline

# Ridgeline production stack for the VM (lnuvm159). All public access arrives
# through the existing Cloudflare Tunnel, so services bind to localhost only and
# Cloudflare terminates TLS at the edge:
#   ridgeline.ve7kod.ca  -> tunnel -> localhost:8088 (caddy -> ridgelined)
#   mqtt-dev.ve7kod.ca   -> tunnel -> localhost:9001 (mosquitto websockets)
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ridgeline-mosquitto
    restart: unless-stopped
    ports:
      # Host 9101 (CoreScope's broker still holds 9001 during the parallel
      # transition) -> container 9001. Tunnel: mqtt-dev.ve7kod.ca -> localhost:9101.
      # Bind BOTH loopbacks: on this VM `localhost` resolves to ::1 (IPv6) only,
      # so cloudflared dialing localhost:9101 needs the IPv6 bind or it 502s.
      - "127.0.0.1:9101:9001" # observer websockets, reached via the tunnel
      - "[::1]:9101:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  ridgelined:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ridgeline:latest
    container_name: ridgeline-app
    restart: unless-stopped
    # Run as the host user that owns ./data so the bind-mounted DB dir + migrated
    # ridgeline.db are writable without a chown. Defaults to 1000 (jesse locally);
    # the VM user ve7kod is 1001, so create deploy/.env with the box's real ids:
    #   printf 'RIDGELINE_UID=%s\nRIDGELINE_GID=%s\n' "$(id -u)" "$(id -g)" > .env
    user: "${RIDGELINE_UID:-1000}:${RIDGELINE_GID:-1000}"
    depends_on:
      - mosquitto
    volumes:
      - ./config.json:/config/config.json:ro
      - ./data:/data # migrated ridgeline.db lives here (bind mount)
    # No host port: caddy reaches it over the compose network as ridgelined:8080.

  caddy:
    image: caddy:2-alpine
    container_name: ridgeline-caddy
    restart: unless-stopped
    depends_on:
      - ridgelined
    ports:
      - "127.0.0.1:8088:80" # ingress, reached via the tunnel
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mosquitto-data:
  caddy-data:
  caddy-config:
